<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="main-page">

  <div class="dashboard">

    <!-- ===== HEADER ===== -->

    <header class="dashboard-header">

      <div class="logo-section">
        <h1>Music App</h1>
        <p>
          Welcome,
          <span id="user"></span> 
        </p>
      </div>

      <button class="logout-btn" onclick="logout()">
        ⎋ Logout
      </button>

    </header>

    <!-- ===== SEARCH SECTION ===== -->

    <section class="dashboard-card">

      <h2>🔎 Search Music</h2>

      <p class="section-text">
        Search for music by title, artist, album or year
      </p>

      <div class="search-grid">

        <input
          type="text"
          id="title"
          placeholder="🎵 Title"
        >

        <input
          type="text"
          id="artist"
          placeholder="👤 Artist"
        >

        <input
          type="text"
          id="year"
          placeholder="📅 Year"
        >

        <input
          type="text"
          id="album"
          placeholder="💿 Album"
        >

      </div>

      <button class="query-btn" onclick="search()">
        🔍 Search
      </button>

    </section>

    <!-- ===== SUBSCRIPTIONS ===== -->

    <section class="dashboard-card">

      <h2>💜 Your Subscriptions</h2>

      <div id="subscriptions" class="music-grid">

        <div class="empty-state">
          <p>No subscriptions yet.</p>
          <span>Search for music and subscribe to your favourites!</span>
        </div>

      </div>

    </section>

    <!-- ===== RESULTS ===== -->

    <section class="dashboard-card">

      <h2>🎶 Search Results</h2>

      <div id="results" class="music-grid">

        <div class="empty-state">
          <p>No results to display.</p>
          <span>Use the search form above to find music.</span>
        </div>

      </div>

    </section>

  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>

</body>
</html>
